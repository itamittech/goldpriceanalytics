spring:
  application:
    name: gold-price-analytics

  datasource:
    url: jdbc:h2:mem:goldanalyticsdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

  threads:
    virtual:
      enabled: true

server:
  port: 8080
  compression:
    enabled: true

# API Keys (to be configured)
api:
  alpha-vantage:
    key: ${ALPHA_VANTAGE_API_KEY:demo}
    base-url: https://www.alphavantage.co

  news-api:
    key: ${NEWS_API_KEY:}
    base-url: https://newsapi.org/v2

# Application Settings
analytics:
  cache:
    enabled: true
    ttl-minutes: 60

  data-collection:
    scheduled: true
    interval-hours: 6

  insights:
    max-events-per-query: 100
    correlation-threshold: 0.5

logging:
  level:
    com.goldanalytics: INFO
    org.springframework.web: INFO
    org.hibernate: WARN
